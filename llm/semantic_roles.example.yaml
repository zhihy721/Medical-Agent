# Draft semantic extractor only. Planner/reviewer retain their own base roles.
# Token budgets still need G2 measurement; long inputs must fail, never truncate.
roles:
  intent:
    provider: vllm
    model_id: qwen3.5-4b
    api_url: http://127.0.0.1:8000/v1/chat/completions
    timeout_s: 30
    max_tokens: 512
    temperature: 0
    enable_thinking: false
